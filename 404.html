<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | PPSHoly</title>
  <meta name="theme-color" content="#0D0B21">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0D0B21; color: #F6F5EE; font: 400 17px/1.55 "Barlow", "Segoe UI", system-ui, sans-serif; }
    main { padding: 24px; max-width: 520px; }
    .slats { width: 150px; height: 67px; margin: 0 0 28px 14px; transform: skewX(-16deg); background: repeating-linear-gradient(#DEE340 0 7px, transparent 7px 12px); }
    h1 { font: italic 800 clamp(56px, 12vw, 84px)/1 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; text-transform: uppercase; margin: 0 0 14px; }
    p { margin: 0 0 28px; color: #A9A6C4; }
    a { display: inline-block; margin-left: 12px; padding: 14px 28px; background: #DEE340; color: #0D0B21; text-decoration: none; text-transform: uppercase; letter-spacing: .04em; font: italic 800 22px/1 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; transform: skewX(-16deg); box-shadow: -6px 0 0 #3929EA, -10px 0 0 #C60000; }
    a span { display: block; transform: skewX(16deg); }
    a:focus-visible { outline: 3px solid #9C93FF; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="slats" aria-hidden="true"></div>
    <h1>Nothing here</h1>
    <p>That page does not exist, or the game moved. The full list is on the home page.</p>
    <a id="home" href="/"><span>All games</span></a>
  </main>
  <script>
    // On a GitHub Pages project site the home page lives under /<repo>/.
    if (/\.github\.io$/.test(location.hostname)) {
      var repo = location.pathname.split("/")[1];
      if (repo) document.getElementById("home").href = "/" + repo + "/";
    }
  </script>
</body>
</html>
